name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Verify phase 1
        working-directory: backend
        run: npm run verify:phase1
      - name: Verify phase 2
        working-directory: backend
        run: npm run verify:phase2
      - name: Verify phase 3
        working-directory: backend
        run: npm run verify:phase3
      - name: Verify phase 4
        working-directory: backend
        run: npm run verify:phase4
      - name: Verify phase 5
        working-directory: backend
        run: npm run verify:phase5
      - name: Verify phase 6
        working-directory: backend
        run: npm run verify:phase6
      - name: Verify phase 7
        working-directory: backend
        run: npm run verify:phase7
      - name: Verify phase 8
        working-directory: backend
        run: npm run verify:phase8
      - name: Verify phase 9
        working-directory: backend
        run: npm run verify:phase9
      - name: Verify phase 10
        working-directory: backend
        run: npm run verify:phase10
      - name: Verify phase 11
        working-directory: backend
        run: npm run verify:phase11
      - name: Verify phase 12
        working-directory: backend
        run: npm run verify:phase12
      - name: Verify phase 13
        working-directory: backend
        run: npm run verify:phase13
      - name: Verify phase 14
        working-directory: backend
        run: npm run verify:phase14
      - name: Verify phase 16
        working-directory: backend
        run: npm run verify:phase16
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
